openapi: "3.0.3"
info:
  title: Employee Attendance & Analytics API
  version: 2.0.0
paths:
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /employees:
    post:
      summary: Create Employee
      operationId: create_employee_employees_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          type: string
          description: API Key for authentication
          title: X-Api-Key
        description: API Key for authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
    get:
      summary: List Employees
      operationId: list_employees_employees_get
      parameters:
      - name: department
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /attendance/punch-in:
    post:
      summary: Punch In
      operationId: punch_in_attendance_punch_in_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          type: string
          description: API Key for authentication
          title: X-Api-Key
        description: API Key for authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchInIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /attendance:
    get:
      summary: List Attendance
      operationId: list_attendance_attendance_get
      parameters:
      - name: emp_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Emp Code
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date To
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: x-api-key
        in: header
        required: false
        schema:
          type: string
          description: API Key for authentication
          title: X-Api-Key
        description: API Key for authentication
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /attendance/punch-out:
    post:
      summary: Punch Out
      operationId: punch_out_attendance_punch_out_post
      parameters:
      - name: x-api-key
        in: header
        required: false
        schema:
          type: string
          description: API Key for authentication
          title: X-Api-Key
        description: API Key for authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchOutIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /attendance/{emp_code}/{date}:
    patch:
      summary: Regularize
      operationId: regularize_attendance__emp_code___date__patch
      parameters:
      - name: emp_code
        in: path
        required: true
        schema:
          type: string
          title: Emp Code
      - name: date
        in: path
        required: true
        schema:
          type: string
          title: Date
      - name: x-api-key
        in: header
        required: false
        schema:
          type: string
          description: API Key for authentication
          title: X-Api-Key
        description: API Key for authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegularizeIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /analytics/employees/{emp_code}/monthly:
    get:
      summary: Employee Monthly
      operationId: employee_monthly_analytics_employees__emp_code__monthly_get
      parameters:
      - name: emp_code
        in: path
        required: true
        schema:
          type: string
          title: Emp Code
      - name: month
        in: query
        required: true
        schema:
          type: string
          title: Month
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analytics/departments/summary:
    get:
      summary: Department Summary
      operationId: department_summary_analytics_departments_summary_get
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: string
          title: Month
      - name: department
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analytics/leaderboard/late:
    get:
      summary: Late Leaderboard
      operationId: late_leaderboard_analytics_leaderboard_late_get
      parameters:
      - name: month
        in: query
        required: true
        schema:
          type: string
          title: Month
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limit
      - name: department
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /analytics/departments/{department}/trend:
    get:
      summary: Department Trend
      operationId: department_trend_analytics_departments__department__trend_get
      parameters:
      - name: department
        in: path
        required: true
        schema:
          type: string
          title: Department
      - name: from
        in: query
        required: true
        schema:
          type: string
          title: From
      - name: to
        in: query
        required: true
        schema:
          type: string
          title: To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/explain/{endpoint}:
    get:
      summary: Explain
      operationId: explain_admin_explain__endpoint__get
      parameters:
      - name: endpoint
        in: path
        required: true
        schema:
          type: string
          title: Endpoint
      - name: emp_code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Emp Code
      - name: month
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Month
      - name: department
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date To
      - name: from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: From
      - name: to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: To
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 10
          title: Limit
      - name: x-api-key
        in: header
        required: false
        schema:
          type: string
          description: API Key for authentication
          title: X-Api-Key
        description: API Key for authentication
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
components:
  schemas:
    EmployeeIn:
      properties:
        emp_code:
          type: string
          pattern: ^EMP\d{4,6}$
          title: Emp Code
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        email:
          type: string
          maxLength: 120
          minLength: 3
          title: Email
        department:
          type: string
          maxLength: 50
          minLength: 1
          title: Department
        shift_start:
          type: string
          title: Shift Start
          default: 09:30
        shift_end:
          type: string
          title: Shift End
          default: '18:30'
        joined_on:
          type: string
          title: Joined On
      additionalProperties: false
      type: object
      required:
      - emp_code
      - name
      - email
      - department
      - joined_on
      title: EmployeeIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PunchInIn:
      properties:
        emp_code:
          type: string
          minLength: 1
          title: Emp Code
        punched_at:
          anyOf:
          - type: integer
            maximum: 4102444800000.0
            minimum: 100000000000.0
          - type: 'null'
          title: Punched At
        status:
          type: string
          title: Status
          default: PRESENT
      additionalProperties: false
      type: object
      required:
      - emp_code
      title: PunchInIn
    PunchOutIn:
      properties:
        emp_code:
          type: string
          minLength: 1
          title: Emp Code
        punched_at:
          anyOf:
          - type: integer
            maximum: 4102444800000.0
            minimum: 100000000000.0
          - type: 'null'
          title: Punched At
      additionalProperties: false
      type: object
      required:
      - emp_code
      title: PunchOutIn
    RegularizeIn:
      properties:
        status:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
        punch_in:
          anyOf:
          - type: integer
          - type: 'null'
          title: Punch In
        punch_out:
          anyOf:
          - type: integer
          - type: 'null'
          title: Punch Out
        reason:
          type: string
          maxLength: 200
          minLength: 5
          title: Reason
        regularized_by:
          type: string
          maxLength: 50
          minLength: 1
          title: Regularized By
      additionalProperties: false
      type: object
      required:
      - reason
      - regularized_by
      title: RegularizeIn
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key


# Business Rules R1, R2, R3, R4, R5, R6, R7, R8, R9, R10 compliance documented.
