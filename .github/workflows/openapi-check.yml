name: OpenAPI schema and tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, autter/fix-updates]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify generated OpenAPI schema is committed
        env:
          API_KEY: ci-test-key
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: attendance_test
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code -- openapi.yaml

      - name: Run tests
        env:
          API_KEY: ci-test-key
          MONGO_URI: mongodb://localhost:27017
          MONGO_DB: attendance_test
        run: python -m pytest -q -W default
