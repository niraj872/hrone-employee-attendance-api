name: OpenAPI schema and tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, security/dependency-hardening-nov-2026]

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      API_KEY: ci-test-key
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: attendance_test_db

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up the production Python version
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Upgrade pip and install audit tooling
        run: |
          python -m pip install --upgrade "pip>=26.2.2" "pip-audit>=2.10.1,<3"

      - name: Install application dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Audit the complete resolved dependency tree
        run: pip-audit --strict -r requirements.txt

      - name: Verify generated OpenAPI schema is committed
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code -- openapi.yaml

      - name: Run tests
        run: python -m pytest -q -W default
