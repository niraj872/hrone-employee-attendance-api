name: OpenAPI schema and tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, autter/fix-updates, autter/final-audit-cleanup]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      API_KEY: ci-test-key
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB: attendance_test_db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify generated OpenAPI schema is committed
        run: |
          python scripts/generate_openapi.py
          git diff --exit-code -- openapi.yaml

      - name: Run tests
        run: python -m pytest -q -W default